<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>입력 페이지 샘플</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #1f2933;
        --muted: #52606d;
        --border: #d9e2ec;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --focus: #93c5fd;
        --error: #b91c1c;
        --ok: #047857;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      .page {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
      }

      .lead {
        margin: 0 0 24px;
        color: var(--muted);
      }

      form {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        display: grid;
        gap: 18px;
      }

      fieldset {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin: 0;
        display: grid;
        gap: 14px;
      }

      legend {
        padding: 0 8px;
        font-weight: 600;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 0.95rem;
      }

      .hint {
        font-size: 0.8rem;
        color: var(--muted);
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"],
      input[type="url"],
      input[type="search"],
      input[type="number"],
      input[type="date"],
      input[type="time"],
      input[type="datetime-local"],
      input[type="month"],
      input[type="week"],
      input[type="file"],
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: inherit;
        background: #fff;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--focus);
        border-color: var(--accent);
      }

      .inline {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
      }

      .inline label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      @media (max-width: 560px) {
        .row {
          grid-template-columns: 1fr;
        }
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        font: inherit;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid transparent;
        cursor: pointer;
      }

      button[type="submit"] {
        background: var(--accent);
        color: #fff;
      }

      button[type="submit"]:hover {
        background: var(--accent-hover);
      }

      button[type="reset"] {
        background: #fff;
        border-color: var(--border);
      }

      #result {
        display: none;
        padding: 12px 14px;
        border-radius: 8px;
        background: #ecfdf5;
        color: var(--ok);
        border: 1px solid #a7f3d0;
        white-space: pre-wrap;
      }

      #result.error {
        background: #fef2f2;
        color: var(--error);
        border-color: #fecaca;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>입력 페이지 샘플</h1>
      <p class="lead">자주 쓰는 HTML 입력 요소를 한 페이지에서 확인할 수 있는 예제입니다.</p>

      <form id="sample-form" novalidate>
        <fieldset>
          <legend>기본 정보</legend>
          <label>
            이름
            <input type="text" name="name" placeholder="홍길동" required minlength="2" autocomplete="name" />
          </label>
          <div class="row">
            <label>
              이메일
              <input type="email" name="email" placeholder="you@example.com" required autocomplete="email" />
            </label>
            <label>
              비밀번호
              <input type="password" name="password" required minlength="8" autocomplete="new-password" />
              <span class="hint">8자 이상</span>
            </label>
          </div>
          <div class="row">
            <label>
              전화번호
              <input type="tel" name="phone" placeholder="010-1234-5678" autocomplete="tel" />
            </label>
            <label>
              웹사이트
              <input type="url" name="website" placeholder="https://example.com" />
            </label>
          </div>
          <label>
            검색어
            <input type="search" name="query" placeholder="키워드 검색" />
          </label>
        </fieldset>

        <fieldset>
          <legend>숫자 · 날짜</legend>
          <div class="row">
            <label>
              나이
              <input type="number" name="age" min="1" max="120" step="1" />
            </label>
            <label>
              만족도
              1
              <input type="range" name="score" min="1" max="10" value="7" />
              10
            </label>
          </div>
          <div class="row">
            <label>
              날짜
              <input type="date" name="date" />
            </label>
            <label>
              시간
              <input type="time" name="time" />
            </label>
          </div>
          <div class="row">
            <label>
              일시
              <input type="datetime-local" name="datetime" />
            </label>
            <label>
              월 / 주
              <input type="month" name="month" />
              <input type="week" name="week" />
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>선택</legend>
          <div>
            <div class="hint" style="margin-bottom: 8px">관심 분야 (복수 선택)</div>
            <div class="inline">
              <label><input type="checkbox" name="interests" value="html" /> HTML</label>
              <label><input type="checkbox" name="interests" value="css" /> CSS</label>
              <label><input type="checkbox" name="interests" value="js" /> JavaScript</label>
            </div>
          </div>
          <div>
            <div class="hint" style="margin-bottom: 8px">연락 방법</div>
            <div class="inline">
              <label><input type="radio" name="contact" value="email" checked /> 이메일</label>
              <label><input type="radio" name="contact" value="phone" /> 전화</label>
              <label><input type="radio" name="contact" value="none" /> 받지 않음</label>
            </div>
          </div>
          <label>
            국가
            <select name="country">
              <option value="">선택하세요</option>
              <option value="kr" selected>대한민국</option>
              <option value="us">미국</option>
              <option value="jp">일본</option>
            </select>
          </label>
          <label>
            테마 색
            <input type="color" name="theme" value="#2563eb" />
          </label>
        </fieldset>

        <fieldset>
          <legend>기타</legend>
          <label>
            프로필 사진
            <input type="file" name="photo" accept="image/*" />
          </label>
          <label>
            소개
            <textarea name="bio" rows="4" placeholder="간단한 소개를 입력하세요."></textarea>
          </label>
          <label class="inline">
            <input type="checkbox" name="agree" required />
            개인정보 수집 및 이용에 동의합니다.
          </label>
        </fieldset>

        <div class="actions">
          <button type="submit">제출</button>
          <button type="reset">초기화</button>
        </div>
        <div id="result" role="status"></div>
      </form>
    </main>

    <script>
      const form = document.getElementById("sample-form");
      const result = document.getElementById("result");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        result.classList.remove("error");

        if (!form.checkValidity()) {
          result.classList.add("error");
          result.textContent = "필수 항목을 확인해 주세요.";
          result.style.display = "block";
          form.reportValidity();
          return;
        }

        const data = new FormData(form);
        const lines = [];
        for (const [key, value] of data.entries()) {
          if (value instanceof File) {
            lines.push(key + ": " + (value.name || "(파일 없음)"));
          } else {
            lines.push(key + ": " + value);
          }
        }

        result.textContent = "제출된 값\n" + lines.join("\n");
        result.style.display = "block";
      });

      form.addEventListener("reset", () => {
        result.style.display = "none";
        result.textContent = "";
      });
    </script>
  </body>
</html>
